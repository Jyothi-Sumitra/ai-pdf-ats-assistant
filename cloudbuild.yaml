steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/ai-pdf-assistant', '.' ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/ai-pdf-assistant' ]

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [ 'run', 'deploy', 'ai-pdf-assistant', '--image', 'gcr.io/$PROJECT_ID/ai-pdf-assistant', '--region', 'us-central1', '--platform', 'managed', '--allow-unauthenticated' ]

timeout: '1200s'
